apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: petclinic
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system        # this is created automatically by flux bootstrap
  path: ./clusters/aks-demo/apps
  prune: true
  wait: true