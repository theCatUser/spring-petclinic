apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system        # same GitRepository, different path
  path: ./clusters/aks-demo/observability
  prune: true
  dependsOn:
    - name: petclinic  